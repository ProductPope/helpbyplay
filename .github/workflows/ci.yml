name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: JS syntax
        run: for f in $(find . -name '*.js' -not -path './.git/*'); do node --check "$f"; done

      - name: Translations and language rules
        run: php .github/scripts/check.php
