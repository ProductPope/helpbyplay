name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['**.txt', 'LICENSE', 'assets/**/*.png', 'assets/**/*.jpg', 'assets/**/*.svg']
  pull_request:
    paths-ignore: ['**.txt', 'LICENSE', 'assets/**/*.png', 'assets/**/*.jpg', 'assets/**/*.svg']
  workflow_dispatch:

# A newer push to the same branch/PR cancels the run still in progress
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'

      - name: PHP syntax
        run: find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l

      - name: JS syntax
        run: for f in $(find . -name '*.js' -not -path './.git/*'); do node --check "$f"; done

      - name: Translations and language rules
        run: php .github/scripts/check.php
